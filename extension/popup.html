<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { width: 420px; margin: 0; color: #e2e8f0; background: #0f172a; font: 13px/1.4 system-ui, sans-serif; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
      h1 { margin: 0; font-size: 15px; }
      #refresh { border: 0; color: #93c5fd; background: none; cursor: pointer; }
      #search { width: calc(100% - 20px); margin: 0 10px 7px; padding: 8px 10px; border: 1px solid #334155; border-radius: 7px; color: #e2e8f0; outline: none; background: #1e293b; }
      #search:focus { border-color: #60a5fa; }
      #servers { max-height: 390px; overflow-y: auto; padding: 0 10px 10px; }
      .server { display: grid; grid-template-columns: 1fr auto; gap: 6px; width: 100%; margin: 5px 0; padding: 6px; border: 1px solid #334155; border-radius: 9px; color: inherit; background: #1e293b; }
      .server:hover, .server.current { border-color: #60a5fa; background: #172554; }
      .open { display: grid; grid-template-columns: 52px 1fr auto; gap: 9px; align-items: center; min-width: 0; padding: 4px; border: 0; color: inherit; text-align: left; background: transparent; cursor: pointer; }
      .kill { align-self: center; padding: 5px 7px; border: 1px solid #7f1d1d; border-radius: 5px; color: #fca5a5; background: #450a0a; cursor: pointer; }
      .kill:hover { background: #7f1d1d; }
      .warning { grid-column: 1 / -1; padding: 5px 7px; border-radius: 5px; color: #fed7aa; background: #431407; font-size: 11px; }
      .metrics { grid-column: 1 / -1; display: flex; gap: 9px; padding: 0 5px; color: #64748b; font: 10px ui-monospace, monospace; }
      .actions { grid-column: 1 / -1; display: flex; gap: 5px; }
      .action { padding: 4px 7px; border: 1px solid #475569; border-radius: 5px; color: #cbd5e1; background: #0f172a; cursor: pointer; font-size: 11px; }
      .action:hover { border-color: #60a5fa; color: white; }
      .port { color: #93c5fd; font: 700 12px ui-monospace, monospace; }
      .folder, .branch { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .folder { font-weight: 650; }
      .branch { color: #94a3b8; font: 11px ui-monospace, monospace; }
      .state { color: #fbbf24; font-size: 11px; }
      .empty { padding: 20px 6px; color: #fca5a5; text-align: center; }
      .guide { display: grid; gap: 8px; padding: 16px 6px; color: #cbd5e1; }
      .guide-title { color: #fca5a5; font-weight: 650; }
      .command { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid #334155; border-radius: 7px; background: #1e293b; }
      .command code { color: #93c5fd; font: 12px ui-monospace, monospace; }
      .guide-note { color: #64748b; font-size: 11px; }
      fieldset { display: flex; flex-wrap: wrap; gap: 10px 14px; margin: 0; padding: 11px 16px 14px; border: 0; border-top: 1px solid #334155; color: #cbd5e1; }
      label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
      select { color: #e2e8f0; border: 1px solid #475569; border-radius: 5px; background: #1e293b; }
    </style>
  </head>
  <body>
    <header><h1 data-i18n="serversTitle"></h1><button id="refresh" data-i18n="refresh"></button></header>
    <input id="search" type="search" />
    <main id="servers"></main>
    <fieldset>
      <label><input id="overlay" type="checkbox" /> <span data-i18n="settingOverlay"></span></label>
      <label><input id="watermark" type="checkbox" /> <span data-i18n="settingWatermark"></span></label>
      <label><input id="title" type="checkbox" /> <span data-i18n="settingTitle"></span></label>
      <label><input id="autoGroup" type="checkbox" /> <span data-i18n="settingAutoGroup"></span></label>
      <label><span data-i18n="settingBadge"></span> <select id="badge"><option value="port" data-i18n="badgePort"></option><option value="branch" data-i18n="badgeBranch"></option></select></label>
      <label><span data-i18n="settingLanguage"></span> <select id="language"><option value="auto" data-i18n="languageAuto"></option><option value="en">English</option><option value="ko">한국어</option></select></label>
    </fieldset>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
